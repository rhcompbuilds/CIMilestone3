{% extends 'base.html' %}
{% load static %}

{% block head %}
    <title>Activity Scheduler</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Drag & Drop Scheduler</h1>
    <div class="container scheduler-container">
        <div class="activity-list activity-panel">
            <h2>Available Activities</h2>
            <div id="activity-container">
                </div>
        </div>

        <div class="timetable-panel">
            <h2>Weekly Timetable</h2>
            <div id="timetable-grid" class="timetable-grid">
                <div class="timetable-header"></div>
                <div class="timetable-header">Mon</div>
                <div class="timetable-header">Tue</div>
                <div class="timetable-header">Wed</div>
                <div class="timetable-header">Thu</div>
                <div class="timetable-header">Fri</div>
                <div class="timetable-header">Sat</div>
                <div class="timetable-header">Sun</div>
            </div>
        </div>
    </div>
    
    <div id="message-container" class="message-container"></div>

    <div id="data-config" 
         style="display: none;"
         data-is-superuser="{{ request.user.is_superuser|yesno:'true,false' }}"
         data-is-staff="{{ request.user.is_staff|yesno:'true,false' }}"
         data-times="['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00']"
    ></div>

    
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/scheduler_drag_drop.js' %}"></script>
{% endblock %}
